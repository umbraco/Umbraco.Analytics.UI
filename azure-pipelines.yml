name: $(TeamProject)_$(Build.DefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - release/*
      - hotfix/*
  tags:
    include:
      - release-*

resources:
  repositories:
    - repository: build
      type: github
      name: umbraco/Umbraco.Build
      endpoint: umbraco

parameters:
  - name: prerelease
    displayName: Prerelease
    type: string
    default: auto
    values:
      - auto # Only release to MyGet on public releases, otherwise skip
      - prerelease # Release to MyGet pre-release feed, regardless of release type
      - nightly # Release to MyGet nightly feed, regardless of release type
      - skip # Skip releasing to MyGet, regardless of release type
  - name: release
    displayName: Release
    type: string
    default: auto
    values:
      - auto # Only release to NuGet on public, stable releases, otherwise skip
      - public # Release to NuGet, regardless of release type
      - skip # Skip releasing to NuGet, regardless of release type
  - name: sbom_generate
    displayName: Generate SBOM
    type: boolean
    default: false # SBOM is still generated for release/hotfix branches and release-* tags

# Runs in the "Umbraco Extensions" Azure DevOps project. NuGet uses the template's default connection names
# (MyGet - Nightly, MyGet - Pre-releases, NuGet); the project's npm MyGet connections are named below.
# TODO before the first public npm release: an npmjs.org connection, then set npm_service_connection below to
# its name. Until then it is blank, so the Release stage leaves its NPM job out at compile time: Azure checks
# every referenced connection at queue time, and the missing "NPM" made every PR build (release: auto) fail.
# TODO before the first public release: a release approval environment (release_environment) and the
# Dependency-Track variable group for SBOM uploads (sbom_dt_variable_group); the project has neither yet.
# The package is @umbraco/analytics-ui, in Umbraco's shared @umbraco npm scope.
extends:
  template: devops/templates/azure-pipelines-template.yml@build
  parameters:
    product_name: Umbraco.Analytics.UI
    npm_scope: '@umbraco'
    prerelease: ${{ parameters.prerelease }}
    # Every release-* tag, prereleases (e.g. release-19.0.0-rc.1) included, goes to NuGet.org after approval
    release: ${{ parameters.release }}
    # Once Release has published, a GitHub release on the release-<version> tag with that version's notes from
    # CHANGELOG.md (an RC uses its final version's section). The build fails if the section is missing or empty.
    # "umbraco" is the GitHub connection this project already uses to fetch Umbraco.Build.
    github_release_connection: umbraco
    run_tests: skip # No .NET test projects; client tests run in the ClientTests stage below
    # Client lint, browser tests (Chromium, Firefox, WebKit) and a Storybook build. Prerelease/Release
    # depend on this stage by name, so a failing test or a broken story blocks publishing.
    additional_tests:
      - stage: ClientTests
        displayName: Client tests
        dependsOn: BuildAndPack
        jobs:
          - job: ClientTests
            displayName: Lint, test and build Storybook
            pool:
              vmImage: ubuntu-latest
            # The Playwright image has Node and all three browsers. Chart screenshot baselines are made in
            # this same image (npm run test:screenshots), so it must match the playwright version in
            # package-lock.json and the image in run-in-container.sh and storybook.yml. Bump all of them together.
            container: mcr.microsoft.com/playwright:v1.64.1-noble
            variables:
              # The Umbraco.Build template sets this to a cache folder on the agent, which would hide the
              # browsers baked into the image, so no browser could launch.
              PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
            steps:
              - checkout: self
                fetchDepth: 1

              - script: npm run ci:install-client
                displayName: NPM Install

              - script: npm run ci:lint-client
                displayName: Lint

              # Fails if the public API changed and api/*.api.md was not updated and committed. Run before
              # anything that runs `build:api`, which rewrites the reports (API Extractor --local).
              - script: npm run ci:check-api-client
                displayName: Check API reports

              # TF_BUILD makes vite.config.ts run every browser engine, not just Chromium. Screenshot specs
              # run in Chromium on Linux only (the image) and skip in Firefox and WebKit.
              - script: npm run ci:test-client
                displayName: Run client tests

              # The timing specs run alone (Chromium, one file at a time): sharing the runner with three
              # engines would make them flaky. vite.config.ts leaves them out of the step above on CI.
              - script: npm run ci:test-perf-client
                displayName: Run client performance tests

              - task: PublishTestResults@2
                displayName: Publish test results
                condition: succeededOrFailed()
                inputs:
                  testResultsFormat: JUnit
                  testResultsFiles: src/Umbraco.Analytics.UI/Client/test-results/junit.xml
                  testRunTitle: Client tests

              # A failed chart isolation spec writes both canvases and what each chart resolved here
              # (src/internal/test/chart-diagnostics.ts), so a CI-only mismatch can be explained.
              - publish: src/Umbraco.Analytics.UI/Client/test-results/chart-diagnostics
                artifact: chart-diagnostics-$(System.JobAttempt)
                displayName: Publish chart diagnostics
                condition: failed()
                continueOnError: true

              # Proves every story still builds; the site itself is published to GitHub Pages
              - script: npm run ci:storybook-client
                displayName: Build Storybook

              - publish: src/Umbraco.Analytics.UI/Client/storybook-static
                artifact: storybook
                displayName: Publish Storybook artifact
    sbom_generate: ${{ parameters.sbom_generate }}
    sbom_upload: ${{ startsWith(variables['Build.SourceBranch'], 'refs/tags/release-') }}
    # The client is bundled into the NuGet package (Chart.js included), so its dependencies ship too
    sbom_npm_paths:
      - src/Umbraco.Analytics.UI/Client
    npm_nightly_service_connection: npm - Nightly
    npm_prereleases_service_connection: npm - Pre-releases
    npm_service_connection: ''
