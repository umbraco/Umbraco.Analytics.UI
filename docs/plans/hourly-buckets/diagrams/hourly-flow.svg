<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .box { fill: #f4f5fb; stroke: #3544b1; stroke-width: 1.5; }
    .lib { fill: #eef7f1; stroke: #2f7d4f; stroke-width: 1.5; }
    text { fill: #1b264f; }
    .small { font-size: 11px; fill: #4a5070; }
    .arrow { stroke: #4a5070; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    @media (prefers-color-scheme: dark) {
      .box { fill: #1e2440; stroke: #8f9bff; } .lib { fill: #17301f; stroke: #6fcf97; }
      text { fill: #e8eaf6; } .small { fill: #b8bdd8; } .arrow { stroke: #b8bdd8; }
    }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5070"/></marker></defs>

  <rect class="lib" x="20" y="20" width="200" height="70" rx="8"/>
  <text x="120" y="45" text-anchor="middle" font-weight="700">uaui-date-range</text>
  <text x="120" y="66" text-anchor="middle" class="small">"Today": from = to = 2026-11-05</text>

  <rect class="lib" x="280" y="20" width="200" height="70" rx="8"/>
  <text x="380" y="45" text-anchor="middle" font-weight="700">uauiGroupByOptions</text>
  <text x="380" y="66" text-anchor="middle" class="small">≤ 2 days: hour, day</text>

  <rect class="lib" x="540" y="20" width="200" height="70" rx="8"/>
  <text x="640" y="45" text-anchor="middle" font-weight="700">uauiDateBuckets(…, "hour")</text>
  <text x="640" y="66" text-anchor="middle" class="small">24 UTC instants, local hours</text>

  <rect class="box" x="540" y="130" width="200" height="60" rx="8"/>
  <text x="640" y="155" text-anchor="middle" font-weight="700">Product server</text>
  <text x="640" y="175" text-anchor="middle" class="small">counts per bucket start..end</text>

  <rect class="lib" x="20" y="210" width="460" height="70" rx="8"/>
  <text x="250" y="235" text-anchor="middle" font-weight="700">uaui-time-series-chart group-by="hour"</text>
  <text x="250" y="256" text-anchor="middle" class="small">points as instants → local hour → axis, compare by wall-clock hour,</text>
  <text x="250" y="272" text-anchor="middle" class="small">now line + incomplete hatching in the hour that contains now</text>

  <path class="arrow" d="M220,55 L278,55"/>
  <path class="arrow" d="M480,55 L538,55"/>
  <path class="arrow" d="M640,90 L640,128"/>
  <path class="arrow" d="M640,190 L640,245 L482,245"/>
  <text x="648" y="225" class="small">points: { date: "2026-11-05T13:00:00Z", value }</text>
</svg>
