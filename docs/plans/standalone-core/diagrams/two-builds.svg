<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="760" height="360" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Shared source -->
  <rect x="250" y="20" width="260" height="96" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <text x="380" y="46" text-anchor="middle" font-weight="600" fill="#1f2328">Shared source (src/)</text>
  <text x="380" y="68" text-anchor="middle" fill="#1f2328">Every component, as today</text>
  <text x="380" y="90" text-anchor="middle" fill="#57606a">imports Lit, UUI, base element,</text>
  <text x="380" y="106" text-anchor="middle" fill="#57606a">context, dialog via #platform/*</text>

  <!-- Arrows -->
  <line x1="320" y1="116" x2="190" y2="170" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="116" x2="570" y2="170" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Core build -->
  <rect x="30" y="172" width="320" height="96" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="190" y="198" text-anchor="middle" font-weight="600" fill="#1f2328">Core build</text>
  <text x="190" y="220" text-anchor="middle" fill="#1f2328">#platform/* = platform/core</text>
  <text x="190" y="242" text-anchor="middle" fill="#57606a">plain Lit, UUI, own translations,</text>
  <text x="190" y="258" text-anchor="middle" fill="#57606a">UUI modal, own fallback icons</text>

  <!-- Umbraco build -->
  <rect x="410" y="172" width="320" height="96" rx="6" fill="#fff8c5" stroke="#9a6700"/>
  <text x="570" y="198" text-anchor="middle" font-weight="600" fill="#1f2328">Umbraco build</text>
  <text x="570" y="220" text-anchor="middle" fill="#1f2328">#platform/* = platform/umbraco</text>
  <text x="570" y="242" text-anchor="middle" fill="#57606a">backoffice Lit, UUI, UmbLitElement,</text>
  <text x="570" y="258" text-anchor="middle" fill="#57606a">Umbraco translations, modal manager</text>

  <line x1="190" y1="268" x2="190" y2="296" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="268" x2="570" y2="296" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Outputs -->
  <text x="190" y="318" text-anchor="middle" font-weight="600" fill="#1f2328">npm @umbraco/analytics-ui-core</text>
  <text x="190" y="338" text-anchor="middle" fill="#57606a">Umbraco Cloud portal</text>
  <text x="570" y="318" text-anchor="middle" font-weight="600" fill="#1f2328">NuGet + npm @umbraco/analytics-ui</text>
  <text x="570" y="338" text-anchor="middle" fill="#57606a">Engage, Commerce, Umbraco AI (no change)</text>
</svg>
